<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiskeyMusikk – Rankings</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23111' stroke='%23fff' stroke-width='6'/><circle cx='50' cy='50' r='16' fill='%23f59e0b'/><circle cx='50' cy='50' r='5' fill='%23111'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .patreon-glow:hover { box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body class="min-h-screen antialiased bg-neutral-100 text-neutral-900 dark:bg-[#111111] dark:text-[#eaeaea] transition-colors duration-200">

    <div class="max-w-4xl mx-auto px-4 py-10">
        <header class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-6 border-b border-neutral-300 dark:border-neutral-800">
            <div>
                <div class="flex items-center gap-2.5">
                    <h1 class="text-2xl font-bold tracking-tight text-neutral-900 dark:text-white">WhiskeyMusikk Rankings</h1>
                    <span class="px-2 py-0.5 text-xs font-medium bg-neutral-200 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 rounded">Ranked by Bennett</span>
                </div>
                <p class="text-sm text-neutral-500 dark:text-neutral-400 mt-1">Album & track ratings archive</p>
            </div>
            <div class="flex items-center gap-3 text-xs font-medium">
                <div class="relative group">
                    <button class="px-3 py-1.5 bg-neutral-200 hover:bg-neutral-300 dark:bg-neutral-800 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200 rounded border border-neutral-300 dark:border-neutral-700 transition flex items-center gap-1">
                        Download ▾
                    </button>
                    <div class="absolute right-0 pt-1.5 w-40 hidden group-hover:block z-40">
                        <div class="bg-white dark:bg-[#222222] border border-neutral-300 dark:border-neutral-700 rounded shadow-lg py-1 text-xs">
                            <button onclick="exportCSV()" class="w-full text-left px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200">Spreadsheet (.CSV)</button>
                            <button onclick="exportJSON()" class="w-full text-left px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200">Raw Data (.JSON)</button>
                        </div>
                    </div>
                </div>

                <a href="https://www.youtube.com/@WhiskeyMusikk" target="_blank" class="px-3 py-1.5 bg-neutral-900 hover:bg-neutral-700 text-white dark:bg-white dark:hover:bg-neutral-200 dark:text-black font-semibold rounded transition flex items-center gap-1.5">
                    <img src="src/img/youtube.png" alt="YouTube" class="w-4 h-4 object-contain">
                    YouTube Channel
                </a>
            </div>
        </header>

        <div class="flex flex-col sm:flex-row gap-3 my-6">
            <input id="searchInput" type="text" placeholder="Search album, artist, or track..." 
                class="flex-grow px-3.5 py-2 bg-white dark:bg-[#1a1a1a] border border-neutral-300 dark:border-neutral-800 rounded text-sm text-neutral-900 dark:text-white placeholder-neutral-400 dark:placeholder-neutral-500 focus:outline-none focus:border-neutral-500">
            
            <select id="genreFilter" class="px-3 py-2 bg-white dark:bg-[#1a1a1a] border border-neutral-300 dark:border-neutral-800 rounded text-sm text-neutral-800 dark:text-neutral-200 focus:outline-none focus:border-neutral-500">
                <option value="all">All Genres</option>
            </select>

            <select id="albumSort" class="px-3 py-2 bg-white dark:bg-[#1a1a1a] border border-neutral-300 dark:border-neutral-800 rounded text-sm text-neutral-800 dark:text-neutral-200 focus:outline-none focus:border-neutral-500">
                <option value="date-desc">Date: Newest</option>
                <option value="date-asc">Date: Oldest</option>
                <option value="score-desc">Album Score: High to Low</option>
                <option value="score-asc">Album Score: Low to High</option>
                <option value="avg-desc">Track Avg: High to Low</option>
            </select>
        </div>

        <div id="albumsContainer" class="space-y-3"></div>
    </div>

    <div class="fixed bottom-5 left-5 z-50 flex items-center gap-2">
        <button onclick="toggleTheme()" id="themeToggleBtn" class="px-3.5 py-2 rounded-full bg-white dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 border border-neutral-300 dark:border-neutral-700 shadow-md text-xs font-medium hover:bg-neutral-100 dark:hover:bg-neutral-700 transition flex items-center gap-2">
            <span id="themeIcon">☀️</span>
            <span id="themeText">Light Mode</span>
        </button>

        <a href="https://www.patreon.com/cw/WhiskeyMusikk" target="_blank" class="patreon-glow px-3.5 py-2 rounded-full bg-white dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 border border-neutral-300 dark:border-neutral-700 shadow-md text-xs font-medium hover:bg-neutral-100 dark:hover:bg-neutral-700 transition flex items-center gap-2">
            <img src="src/img/patreon.png" alt="Patreon" class="w-4 h-4 object-contain">
            <span>Patreon</span>
        </a>

        <div class="relative group flex items-center">
            <span class="w-5 h-5 rounded-full bg-white dark:bg-neutral-800 text-neutral-600 dark:text-neutral-400 border border-neutral-300 dark:border-neutral-700 shadow-md text-[11px] font-bold flex items-center justify-center cursor-help">i</span>
            <div class="absolute bottom-full left-0 mb-2 w-56 p-2 bg-white dark:bg-[#222222] border border-neutral-300 dark:border-neutral-700 rounded shadow-lg text-[11px] text-neutral-700 dark:text-neutral-300 hidden group-hover:block z-50 pointer-events-none">
                Patreon rankings are not included in this public archive.
            </div>
        </div>
    </div>

    <script>
        let rawData = { albums: [] };
        const openStates = {};
        const trackSortModes = {};

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle("dark");
            document.getElementById("themeIcon").textContent = isDark ? "☀️" : "🌙";
            document.getElementById("themeText").textContent = isDark ? "Light Mode" : "Dark Mode";
        }

        function getSortableScore(scoreStr) {
            if (!scoreStr) return -1;
            const num = parseFloat(scoreStr);
            if (!isNaN(num)) return num;
            const map = { "favorite": 10.1, "hard": 9.2, "really good": 8.5, "good": 7.5, "mid": 5.0, "skip": 2.0, "n/a": -1 };
            return map[scoreStr.toLowerCase().trim()] ?? -1;
        }

        function computeAverageTrackScore(tracks) {
            const numericScores = tracks.map(t => parseFloat(t.score)).filter(n => !isNaN(n));
            return numericScores.length === 0 ? null : (numericScores.reduce((a, b) => a + b, 0) / numericScores.length).toFixed(1);
        }

        function formatScoreDisplay(scoreStr) {
            if (!scoreStr || scoreStr.trim() === "") return "N/A";
            const num = parseFloat(scoreStr);
            return !isNaN(num) ? `${scoreStr}/10` : scoreStr;
        }

        function getScoreColor(scoreStr) {
            if (!scoreStr || scoreStr.trim() === "") return "text-neutral-500";
            const num = parseFloat(scoreStr);
            if (!isNaN(num)) {
                if (num === 10) return "text-purple-600 dark:text-purple-400 font-bold";
                if (num >= 9.0) return "text-emerald-600 dark:text-emerald-400 font-semibold";
                if (num >= 7.5) return "text-green-600 dark:text-green-400";
                if (num >= 6.0) return "text-amber-600 dark:text-yellow-400";
                return "text-red-600 dark:text-red-400";
            }
            const lower = scoreStr.toLowerCase().trim();
            if (lower === "favorite") return "text-purple-600 dark:text-purple-400 font-bold";
            if (lower === "hard") return "text-emerald-600 dark:text-emerald-400 font-semibold";
            if (lower === "really good" || lower === "good") return "text-green-600 dark:text-green-400";
            if (lower === "mid") return "text-amber-600 dark:text-yellow-400";
            if (lower === "skip") return "text-red-600 dark:text-red-400";
            return "text-neutral-400 dark:text-neutral-500";
        }

        function prepareData() {
            rawData.albums.forEach((album, idx) => {
                album._uid = `album_${idx}`;
                if (!album.avg_song_score) album.avg_song_score = computeAverageTrackScore(album.tracks);
                if (!trackSortModes[album._uid]) trackSortModes[album._uid] = "chrono";
            });
        }

        function populateGenres() {
            const genreSet = new Set();
            rawData.albums.forEach(a => {
                a.genres.forEach(g => { if (g && g.trim()) genreSet.add(g.toLowerCase().trim()); });
            });
            const select = document.getElementById("genreFilter");
            Array.from(genreSet).sort().forEach(g => {
                const opt = document.createElement("option");
                opt.value = g;
                opt.textContent = g;
                select.appendChild(opt);
            });
        }

        function toggleDropdown(uid) {
            openStates[uid] = !openStates[uid];
            renderAlbums();
        }

        function setTrackSort(uid, mode) {
            trackSortModes[uid] = mode;
            renderAlbums();
        }

        function renderAlbums() {
            const search = document.getElementById("searchInput").value.toLowerCase().trim();
            const genre = document.getElementById("genreFilter").value;
            const sortMode = document.getElementById("albumSort").value;

            let filtered = rawData.albums.filter(album => {
                const matchAlbum = album.album_clean.toLowerCase().includes(search);
                const matchArtist = album.artist_clean.toLowerCase().includes(search);
                const matchGenre = album.genres.some(g => g.toLowerCase().includes(search));
                const matchTrack = album.tracks.some(t => t.title.toLowerCase().includes(search));
                const matchesSearch = !search || matchAlbum || matchArtist || matchGenre || matchTrack;
                const matchesGenre = genre === "all" || album.genres.some(g => g.toLowerCase().trim() === genre);
                return matchesSearch && matchesGenre;
            });

            filtered.sort((a, b) => {
                if (sortMode === "date-desc") return new Date(b.video_date) - new Date(a.video_date);
                if (sortMode === "date-asc") return new Date(a.video_date) - new Date(b.video_date);
                if (sortMode === "score-desc") return (parseFloat(b.album_score) || 0) - (parseFloat(a.album_score) || 0);
                if (sortMode === "score-asc") return (parseFloat(a.album_score) || 0) - (parseFloat(b.album_score) || 0);
                if (sortMode === "avg-desc") return (parseFloat(b.avg_song_score) || 0) - (parseFloat(a.avg_song_score) || 0);
                return 0;
            });

            const container = document.getElementById("albumsContainer");
            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-12 text-center text-sm text-neutral-500">No results found.</div>`;
                return;
            }

            container.innerHTML = filtered.map(album => {
                const isOpen = !!openStates[album._uid];
                const tSort = trackSortModes[album._uid] || "chrono";
                const sortedTracks = [...album.tracks].sort((t1, t2) => {
                    if (tSort === "chrono") return t1.track_num - t2.track_num;
                    if (tSort === "rating-desc") {
                        const diff = getSortableScore(t2.score) - getSortableScore(t1.score);
                        return diff !== 0 ? diff : t1.track_num - t2.track_num;
                    }
                    if (tSort === "rating-asc") {
                        const s1 = getSortableScore(t1.score), s2 = getSortableScore(t2.score);
                        if (s1 === -1 && s2 === -1) return t1.track_num - t2.track_num;
                        if (s1 === -1) return 1;
                        if (s2 === -1) return -1;
                        return s1 - s2;
                    }
                    return 0;
                });

                const avgDisplay = album.avg_song_score ? `${album.avg_song_score}/10` : "–";

                return `
                    <div class="bg-white dark:bg-[#181818] border border-neutral-300 dark:border-neutral-800 rounded">
                        <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="flex items-center gap-4 min-w-0">
                                <img src="${album.cover_url}" alt="${album.album_clean}" class="w-16 h-16 rounded object-cover flex-shrink-0 bg-neutral-200 dark:bg-neutral-900">
                                <div class="min-w-0">
                                    <h2 class="text-base font-semibold text-neutral-900 dark:text-white truncate">${album.album_clean}</h2>
                                    <p class="text-sm text-neutral-600 dark:text-neutral-400 truncate">${album.artist_clean} <span class="text-neutral-400 dark:text-neutral-600">•</span> ${album.year}</p>
                                    <div class="flex flex-wrap items-center gap-2 mt-1 text-xs text-neutral-500">
                                        <span>${album.genres.join(", ")}</span>
                                        <span>•</span>
                                        <span>Reviewed ${album.video_date}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-wrap items-center justify-between sm:justify-end gap-4 pt-3 sm:pt-0 border-t sm:border-t-0 border-neutral-200 dark:border-neutral-800/80">
                                <div class="flex items-center gap-4 text-right">
                                    <div>
                                        <div class="text-[11px] text-neutral-500 uppercase">Album</div>
                                        <div class="text-sm font-bold text-neutral-900 dark:text-white">${album.album_score}/10</div>
                                    </div>
                                    <div>
                                        <div class="text-[11px] text-neutral-500 uppercase">Track Avg</div>
                                        <div class="text-sm font-medium text-neutral-700 dark:text-neutral-300">${avgDisplay}</div>
                                    </div>
                                </div>

                                <div class="flex items-center gap-2 text-xs">
                                    <a href="${album.youtube_url}" target="_blank" class="px-2.5 py-1.5 bg-neutral-100 hover:bg-neutral-200 dark:bg-neutral-800 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200 rounded transition flex items-center gap-1.5">
                                        <img src="src/img/youtube.png" alt="YouTube" class="w-3.5 h-3.5 object-contain">
                                        Reaction ↗
                                    </a>

                                    <div class="relative group">
                                        <button class="px-2.5 py-1.5 bg-neutral-100 hover:bg-neutral-200 dark:bg-neutral-800 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200 rounded transition flex items-center gap-1">Listen ▾</button>
                                        <div class="absolute right-0 pt-1.5 w-36 hidden group-hover:block z-30">
                                            <div class="bg-white dark:bg-[#222222] border border-neutral-300 dark:border-neutral-700 rounded shadow-lg py-1 text-xs">
                                                ${album.media_links["Spotify"] ? `<a href="${album.media_links["Spotify"]}" target="_blank" class="block px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200 flex items-center gap-2"><img src="src/img/spotify.png" class="w-3.5 h-3.5 object-contain"> Spotify</a>` : ''}
                                                ${album.media_links["Apple Music"] ? `<a href="${album.media_links["Apple Music"]}" target="_blank" class="block px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200 flex items-center gap-2"><img src="src/img/apple.png" class="w-3.5 h-3.5 object-contain"> Apple Music</a>` : ''}
                                                ${album.media_links["Soundcloud"] ? `<a href="${album.media_links["Soundcloud"]}" target="_blank" class="block px-3 py-1.5 hover:bg-neutral-100 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200 flex items-center gap-2"><img src="src/img/soundcloud.png" class="w-3.5 h-3.5 object-contain"> SoundCloud</a>` : ''}
                                            </div>
                                        </div>
                                    </div>

                                    <button onclick="toggleDropdown('${album._uid}')" class="px-3 py-1.5 rounded font-medium transition ${isOpen ? 'bg-neutral-900 text-white dark:bg-white dark:text-black' : 'bg-neutral-100 hover:bg-neutral-200 dark:bg-neutral-800 dark:hover:bg-neutral-700 text-neutral-800 dark:text-neutral-200'}">
                                        Tracks (${album.tracks.length})
                                    </button>
                                </div>
                            </div>
                        </div>

                        ${isOpen ? `
                            <div class="border-t border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-[#141414] px-4 py-3">
                                <div class="flex items-center justify-between mb-2 pb-2 border-b border-neutral-200 dark:border-neutral-800/80 text-xs">
                                    <span class="text-neutral-500 font-medium">Tracklist</span>
                                    <div class="flex gap-2">
                                        <button onclick="setTrackSort('${album._uid}', 'chrono')" class="${tSort === 'chrono' ? 'text-neutral-900 dark:text-white underline font-medium' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'}">Chronological</button>
                                        <span class="text-neutral-300 dark:text-neutral-700">|</span>
                                        <button onclick="setTrackSort('${album._uid}', 'rating-desc')" class="${tSort === 'rating-desc' ? 'text-neutral-900 dark:text-white underline font-medium' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'}">Highest Rated</button>
                                        <span class="text-neutral-300 dark:text-neutral-700">|</span>
                                        <button onclick="setTrackSort('${album._uid}', 'rating-asc')" class="${tSort === 'rating-asc' ? 'text-neutral-900 dark:text-white underline font-medium' : 'text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-300'}">Lowest Rated</button>
                                    </div>
                                </div>

                                <div class="divide-y divide-neutral-200 dark:divide-neutral-800/50 text-sm">
                                    ${sortedTracks.map(track => `
                                        <div class="py-1.5 flex items-center justify-between gap-4">
                                            <div class="flex items-center gap-3 min-w-0">
                                                <span class="w-5 text-xs text-neutral-400 dark:text-neutral-500 text-right">${track.track_num}.</span>
                                                <span class="text-neutral-800 dark:text-neutral-200 truncate">${track.title}</span>
                                            </div>
                                            <span class="text-xs flex-shrink-0 ${getScoreColor(track.score)}">${formatScoreDisplay(track.score)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function escapeCSV(val) {
            const str = String(val ?? "");
            return str.includes(",") || str.includes('"') || str.includes("\n") ? `"${str.replace(/"/g, '""')}"` : str;
        }

        function exportCSV() {
            const rows = [["WHISKEYMUSIKK - OFFICIAL ALBUM & TRACK RANKINGS (Ranked by Bennett)"], []];
            rawData.albums.forEach(a => {
                const avg = a.avg_song_score ? `${a.avg_song_score}/10` : "Qualitative";
                rows.push(["ALBUM", "ARTIST", "RELEASE YEAR", "ALBUM SCORE", "TRACK AVG", "REACTION DATE", "YOUTUBE LINK"]);
                rows.push([a.album_clean, a.artist_clean, a.year, `${a.album_score}/10`, avg, a.video_date, a.youtube_url]);
                rows.push(["Track #", "Song Title", "Rating"]);
                a.tracks.forEach(t => rows.push([t.track_num, t.title, formatScoreDisplay(t.score)]));
                rows.push([], []);
            });
            const csvContent = "\uFEFF" + rows.map(r => r.map(escapeCSV).join(",")).join("\r\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "WhiskeyMusikk_Rankings.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportJSON() {
            const cleanData = { albums: rawData.albums.map(({ _uid, ...rest }) => rest) };
            const blob = new Blob([JSON.stringify(cleanData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "WhiskeyMusikk_Rankings.json";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch("rankings.json");
                rawData = await res.json();
            } catch (err) {
                console.error("Failed to load rankings.json:", err);
            }
            prepareData();
            populateGenres();
            renderAlbums();
            document.getElementById("searchInput").addEventListener("input", renderAlbums);
            document.getElementById("genreFilter").addEventListener("change", renderAlbums);
            document.getElementById("albumSort").addEventListener("change", renderAlbums);
        });
    </script>
</body>
</html>
